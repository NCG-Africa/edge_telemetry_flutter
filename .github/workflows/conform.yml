name: Conformance

# The conformance gate (#127, processor #40): the golden batches must match the real wire and the
# event catalogue at the tag in catalogue.version. Required on every PR and on release tags.
on:
  pull_request:
  push:
    tags: ['v*']

jobs:
  conform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: flutter pub get
      - name: Goldens match the real wire
        run: flutter test test/integration/golden_batch_test.dart
      - name: Goldens conform to the catalogue
        run: scripts/conform.sh
