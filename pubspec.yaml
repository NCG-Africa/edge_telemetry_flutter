name: edge_telemetry_flutter
description: Real User Monitoring and telemetry package for Flutter, performance tracking, and local reporting.
version: 3.0.0
homepage: https://github.com/NCG-Africa/edge_telemetry_flutter
repository: https://github.com/NCG-Africa/edge_telemetry_flutter

# Self-signed localhost key for the TLS seam test (test/fixtures/tls/README.md),
# not a credential. pub flags any PEM private key as a leak.
false_secrets:
  - /test/fixtures/tls/localhost_key.pem

# The declared floor is the TRUE floor (#93). v2 claimed Dart 3.0 / Flutter 3.0
# while `device_info_plus` already demanded Dart 3.7 / Flutter 3.29 — so pub
# resolved this package onto projects that then failed to build. Raising the
# constraint does not drop support that worked; it stops advertising support
# that never did.
environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  # The wrapper seam (#87). The package's first *pure-Dart* runtime dependency
  # — every other one is a platform plugin. Dart-team owned, and already in the
  # pubspec of every consumer who can hit the bypass problem, since
  # `cupertino_http` and `cronet_http` *are* `package:http` implementations.
  # Promoted from transitive to direct: it was already in the lockfile.
  http: ^1.2.0
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.0
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Test-only: fake the docs dir so the OfflineQueue disk seam runs on a temp dir.
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0

flutter:
  plugin:
    platforms:
      # Native crash capture (#27 iOS MetricKit, #28 Android). On any platform
      # without a registered handler, drainNativeCrashes() no-ops via
      # MissingPluginException (see NativeCrashChannel).
      ios:
        pluginClass: EdgeTelemetryFlutterPlugin
      # Android (#28): JVM UncaughtExceptionHandler (all APIs) + ApplicationExitInfo
      # native/ANR (API 30+). Pre-30 native/ANR is a documented gap surfaced via
      # sdk.native_capture_tier.
      android:
        package: com.ncgafrica.edge_telemetry_flutter
        pluginClass: EdgeTelemetryFlutterPlugin
