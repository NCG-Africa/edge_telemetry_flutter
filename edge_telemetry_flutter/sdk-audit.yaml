inconsistencies_and_surprises: >
  - MIXED WIRE-KEY CONVENTIONS: envelope + wireItem keys are camelCase/snake_case
    (eventName, metricName, batch_size, telemetry_batch) while attribute keys are
    dotted (session.id, http.url). app.crash attribute keys are UNPREFIXED
    (message, stacktrace, exception_type, cause, is_fatal) — deliberately, to match
    backend rum_crash_events extractors (edge_event.dart:84). This is drift a
    sibling SDK targeting session.id/http.* convention would not have.
  - ORPHAN ALLOWLIST ENTRIES: user.interaction (event) and resource_timing (metric)
    are in kCanonEvents/kCanonMetrics (wire_canon.dart:19,30) but NO code emits
    them — allowlisted names with no producer.
  - CONSTRUCTED-BUT-DROPPED EVENTS: several hooks build events that the Collector
    allowlist silently discards on-device (never reach the wire):
      telemetry.initialized (edge_telemetry.dart:221),
      performance.monitor_initialized / performance.system_check /
      performance.memory_pressure / performance.startup_time metric (perf_capture_hook.dart:39,73,132,176),
      network.monitor_initialized (network_capture_hook.dart:39),
      network.quality_score metric (network_capture_hook.dart:71).
    Dead work: computed, enriched, then dropped at collector.dart:60.
  - session.finalized emits session.screen_journey (>-joined, capped 20) while the
    live snapshot emits session.visited_screens (comma-joined set) — two different
    screen fields with different formats/keys/delimiters.
  - http.status_code = "0" is overloaded to mean "network error / never completed"
    (http_overrides.dart:339), same sentinel the transport uses for offline.
  - Batch envelope type is "telemetry_batch" but the EventPriority doc comment
    (edge_event.dart:7) calls it type:"batch" — comment/wire mismatch.
  - useJsonFormat / maxBatchSize / batchTimeout / eventBatchSize are all shipped
    deprecated no-ops (OTel-era vestiges); CLAUDE.md still describes the v1.5.2
    JsonEventTracker/SpanManager two-backend architecture that no longer exists.
  - Error-report send/fail logs are unconditional print() by design (retry_transport.dart:91).
  - lib/src/telemetry/edge_telemetry.dart referenced as dead in CLAUDE.md does not
    exist in this tree (facade moved to lib/src/facade/edge_telemetry.dart).

ci_cd:
  what_exists: >
    .github/workflows/ci.yml (at git repo root, one dir above the package):
    on pull_request + push to master, runs in edge_telemetry_flutter/ — flutter pub get,
    dart format --set-exit-if-changed, flutter analyze, flutter test. Checks only.
    .github/workflows/publish.yml: triggered ONLY on version tags v[0-9]+.[0-9]+.[0-9]+*.
  publishes_to: >
    pub.dev via dart-lang/setup-dart publish.yml@v1 reusable workflow, OIDC auth
    (id-token: write, no secret token). Tag-gated only.

open_questions:
  - "Are user.interaction / resource_timing intended to be emitted by a future hook, or stale allowlist entries?"
  - "Does the Collector/backend expect http.url to arrive with query strings, or is client-side URL sanitization intended before v2 GA?"
  - "Is the native crash plugin (edge_telemetry/native_crash channel) shipped in a sibling repo (edge_telemetry_android)? Not present here."
  - "Intended behavior on Pipeline.dispose dropping the unflushed buffer (pipeline.dart:76) vs flush-on-shutdown?"
