group 'com.ncgafrica.edge_telemetry_flutter'
version '1.0'

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.ncgafrica.edge_telemetry_flutter'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // API 21, which is what an existing dependency already demanded (#93):
    // `shared_preferences_android` and `path_provider_android` both declare
    // minSdkVersion 21, so the manifest merger raised the effective floor to 21
    // in every v2 build while this file advertised 19. The declaration now
    // matches reality; no device that worked loses support.
    // ApplicationExitInfo is still guarded at runtime for API 30+; JVM crash
    // capture works on every supported level.
    defaultConfig {
        minSdk 21
    }

    dependencies {
        implementation "androidx.annotation:annotation:1.7.1"
    }
}
